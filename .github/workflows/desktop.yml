name: desktop-release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles appimage"
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "desktop/src-tauri -> target" }
      - name: Fetch model (v0.2 release asset) and verify checksum
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download v0.2 -p model_q4.onnx -D webapp/model
          echo "2c78581a3daeb8078afb652da7ddff1690c02e7f8c59ffc0caed36dca5fadb47  webapp/model/model_q4.onnx" > model.sha256
          if command -v sha256sum >/dev/null; then sha256sum -c model.sha256; else shasum -a 256 -c model.sha256; fi
      - run: npm ci
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2' }}
          releaseName: "Udukratt ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2' }}"
          releaseBody: "Udukratt v0.2: improved model (pass 2, threshold 0.45) and offline desktop apps for Windows (NSIS installer), macOS (universal, unsigned) and Linux (AppImage). Model files (model_q4.onnx, tokenizer.json, vocab.txt, config.json) are attached. Builds are unsigned: see the README for SmartScreen / Gatekeeper notes. Experimental; do not rely on it as the only safeguard for real redaction. Benchmarks: BENCHMARKS.md."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
